<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue des cours — ENS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="mb-8 border-b pb-4">
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">Cours de l'ENS</h1>
      <p class="text-sm text-slate-500">Moteur de recherche et filtres d'accès aux enseignements</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-6">
      <input type="text" id="search" placeholder="Rechercher un cours, prof, sujet..." class="p-2.5 text-sm border rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-slate-400">
      <select id="dept" class="p-2.5 text-sm border rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-slate-400">
        <option value="">Tous les départements</option>
      </select>
      <select id="periode" class="p-2.5 text-sm border rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-slate-400">
        <option value="">Toutes les périodes</option>
        <option value="Semestre 1">Semestre 1</option>
        <option value="Semestre 2">Semestre 2</option>
        <option value="Année">Annuel / Année</option>
      </select>
      <select id="jour" class="p-2.5 text-sm border rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-slate-400">
        <option value="">Tous les jours</option>
        <option value="Lundi">Lundi</option>
        <option value="Mardi">Mardi</option>
        <option value="Mercredi">Mercredi</option>
        <option value="Jeudi">Jeudi</option>
        <option value="Vendredi">Vendredi</option>
      </select>
    </div>

    <div id="count" class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-4"></div>
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>

  <script>
    let deptsLoaded = false;
    async function loadCourses() {
      const q = document.getElementById('search').value;
      const dept = document.getElementById('dept').value;
      const periode = document.getElementById('periode').value;
      const jour = document.getElementById('jour').value;
      const params = new URLSearchParams({q, dept, periode, jour});
      const res = await fetch(`/api/courses?${params}`);
      const data = await res.json();
      
      if (!deptsLoaded && data.departments) {
        const select = document.getElementById('dept');
        data.departments.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d; opt.textContent = d;
          select.appendChild(opt);
        });
        deptsLoaded = true;
      }
      
      document.getElementById('count').textContent = `${data.courses.length} cours trouvé(s)`;
      const grid = document.getElementById('grid');
      grid.innerHTML = data.courses.map(c => `
        <div class="bg-white p-5 rounded-lg border border-slate-200 hover:border-slate-300 transition-all flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-700">${c.departement || 'ENS'}</span>
              ${c.ects ? `<span class="text-xs font-medium text-slate-500">${c.ects} ECTS</span>` : ''}
            </div>
            <h2 class="font-semibold text-slate-900 mb-1 leading-snug">${c.titre}</h2>
            ${c.professeurs ? `<p class="text-xs text-slate-600 mb-3">${c.professeurs.replace(/,/g, ', ')}</p>` : ''}
          </div>
          <div class="border-t pt-3 mt-2 flex items-center justify-between text-xs text-slate-500">
            <div>
              ${c.jour ? `<span class="font-medium text-slate-700">${c.jour}</span> ${c.heure_debut && c.heure_fin ? `${c.heure_debut}-${c.heure_fin}` : ''}` : c.horaire_brut || 'Horaire à confirmer'}
              ${c.lieu ? `<span class="ml-2 text-slate-400">• ${c.lieu}</span>` : ''}
            </div>
            ${c.lien ? `<a href="${c.lien}" target="_blank" class="text-blue-600 font-medium hover:underline">Fiche &rarr;</a>` : ''}
          </div>
        </div>
      `).join('');
    }

    ['search', 'dept', 'periode', 'jour'].forEach(id => {
      document.getElementById(id).addEventListener('input', loadCourses);
    });
    loadCourses();
  </script>
</body>
</html>
